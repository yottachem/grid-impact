name: ingest
on:
  schedule:
    - cron: "0 10 * * *"   # daily 06:00 ET (EDT): daily sources
    - cron: "0 11 * * 1"   # Mondays 07:00 ET: daily + weekly sources
    - cron: "0 12 1 * *"   # 1st of month 08:00 ET: all sources incl. monthly
  workflow_dispatch:
    inputs:
      cadence:
        description: daily | weekly | all
        default: all

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    outputs:
      publish: ${{ steps.diff.outputs.publish }}
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 180  # first EAGLE-I backfill streams ~15 GB
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Restore raw snapshots
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Pick cadence
        id: cad
        run: |
          if [ -n "${{ inputs.cadence }}" ]; then echo "v=${{ inputs.cadence }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 12 1 * *" ]; then echo "v=all" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 11 * * 1" ]; then echo "v=weekly" >> "$GITHUB_OUTPUT"
          else echo "v=daily" >> "$GITHUB_OUTPUT"; fi
      - name: Ingest
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          PEERINGDB_API_KEY: ${{ secrets.PEERINGDB_API_KEY }}
        run: uv run python -m ingest.run --cadence ${{ steps.cad.outputs.v }}
      - name: Save raw snapshots
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
      - name: Detect new data
        id: diff
        if: always()
        run: |
          changed=$( [ -s data/raw/_changed.txt ] && echo true || echo false )
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          # Manual runs always rebuild and republish; scheduled runs only when a source changed
          if [ "$changed" = true ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build marts
        if: always() && steps.diff.outputs.publish == 'true'
        run: uv run python -m transform.run
      - name: Run analysis
        if: always() && steps.diff.outputs.publish == 'true'
        run: uv run python -m analysis.run
      - name: Upload marts and results
        if: always() && steps.diff.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marts-${{ github.run_id }}
          path: |
            data/marts/
            analysis/results/
            data/raw/eia930_annual/
          retention-days: 30
      - name: Build site
        if: always() && steps.diff.outputs.publish == 'true'
        run: uv run python site/build.py
      - name: Upload site
        if: always() && steps.diff.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - name: Freshness check
        id: fresh
        if: always()
        continue-on-error: true
        run: uv run python -m ingest.freshness > freshness.txt
      - name: Open issue for stale sources
        if: always() && steps.fresh.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Stale data sources $(date -u +%F)" --body-file freshness.txt

  deploy:
    needs: ingest
    if: always() && needs.ingest.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

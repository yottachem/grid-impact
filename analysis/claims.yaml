# Every interpretive sentence on the Findings and Methods pages, with the condition it rests on.
# analysis/narrative.py checks each claim on every analysis run.
#
#   text      what the page says. {name:format} fills in a value from the current run
#             (see `uv run python -m analysis.narrative --values`). **bold** is allowed.
#             formats: pct (+1.1%), pct0 (+20%), apct (1.1%, no sign), apct0 (20%), usd, usd_abs ($106, no sign), usd2, int, f0, f1, f2,
#             r100 (rounded to hundreds), month (July 2026), date (October 7, 2026), year
#   holds     the condition the text depends on, as a Python expression over the same values.
#             If false, the page shows `fallback` (current numbers, no interpretation) marked
#             "under review", and the pipeline opens a GitHub issue.
#   variants  several {holds, text} pairs, already reviewed; the first that holds is shown.
#   fallback  neutral wording used while a claim is under review ("" hides the claim).
#   where     findings (default) or methods.
#   refs      ids in reference/literature.yaml this statement draws on (shown as footnotes once approved).
#
# Rewriting: run /rewrite-claims in Claude Code from this repo. A rewrite changes `text` and
# `holds` together so the condition states exactly what the new text asserts. Never loosen
# `holds` just to clear a flag.

# Plausibility ranges. A value outside its range is treated as a possible data problem, not a
# finding: every claim that uses it is held for review (issue label: data-check). Widen a range
# only after confirming the value is real.
checks:
  local.pct40: [-15, 15]
  pjm.latest: [-30, 80]
  pjmr.latest: [-30, 80]
  cap.latest: [0, 1500]
  cap.increase: [-1500, 1500]
  case.bge.ytd: [-40, 60]
  case.dom.ytd: [-40, 60]
  case.tx.ytd: [-40, 60]
  case.ga.ytd: [-40, 60]
  case.bge.idx: [50, 250]
  case.dom.idx: [50, 250]
  case.tx.idx: [50, 250]
  case.ga.idx: [50, 250]
  rel.saidi.pct: [-50, 50]
  rel.county.last: [-90, 300]
  isne.latest: [-30, 80]
  ma.cap.latest: [0, 1000]
  ma.cap.first: [0, 1000]
  ma.price.ng.last: [5, 80]
  ma.price.muni.last: [5, 80]
  ma.comp.share: [0, 100]
  ma.supply.last_supplier: [2, 60]
  ma.supply.last_basic: [2, 60]

claims:
  # ---------------------------------------------------------------- Findings: header
  headline:
    variants:
      - holds: ma.cap.latest < 0.5 * ma.cap.first and ma.dc.pipeline_mw < 1000 and isne.latest_lo > 0 and cap.increase > 0 and fact.imm_dc_share_of_increase_2025_26 >= 50
        text: Massachusetts power bills are high, but data centers aren't why. In PJM, they are.
      - holds: ma.cap.latest < 0.5 * ma.cap.first and ma.dc.pipeline_mw < 1000 and cap.increase > 0
        text: Data centers aren't what's driving Massachusetts power bills. In PJM, they are.
    fallback: What's driving Massachusetts power bills, and where data centers are raising them

  # ---------------------------------------------------------------- Findings: Massachusetts header
  lede_ma:
    holds: ma.cap.latest < ma.cap.first and isne.latest_lo > 0 and isne.y2023 > isne.latest and ma.dc.pipeline_mw < 1000
    text: "Measured from 2020, New England's residential prices after inflation rose {isne.y2023:apct0} more than the rest of the US outside PJM by 2023, and were still {isne.latest:apct0} ahead in {isne.latest_year:year}. Data centers are not the reason: Massachusetts has {ma.dc.op_mw:int} MW of them operating and {ma.dc.pipeline_mw:int} MW proposed, and the capacity charge in a typical Massachusetts home's bill fell from {ma.cap.first:usd} a year in {ma.cap.first_dy} to {ma.cap.latest:usd} for {ma.cap.latest_dy}."
    fallback: "New England's residential prices after inflation, relative to the rest of the US outside PJM and measured from 2020: {isne.y2023:pct} in 2023 and {isne.latest:pct} in {isne.latest_year:year}. Massachusetts data centers: {ma.dc.op_mw:int} MW operating, {ma.dc.pipeline_mw:int} MW proposed. Capacity cost for a typical Massachusetts home: {ma.cap.first:usd} a year in {ma.cap.first_dy}, {ma.cap.latest:usd} for {ma.cap.latest_dy}."

  lede_contrast:
    refs: [imm-2026-som-2025]
    holds: cap.increase > 0 and fact.imm_dc_share_of_increase_2025_26 >= 50 and ma.cap.pjm_same_dy > 2 * ma.cap.latest
    text: "PJM, the grid operator for {fact.pjm_states:int} states and DC from New Jersey to Illinois, shows what it looks like when data centers do drive the market: a capacity shortfall driven largely by forecast data center demand now costs a typical household in a restructured state **about {cap.increase:usd} a year more** than in 2024/25. For {ma.cap.latest_dy}, the same charge is {ma.cap.pjm_same_dy:usd} there against {ma.cap.latest:usd} in Massachusetts."
    fallback: "In PJM, capacity costs a typical household in a restructured state {cap.latest:usd} a year for {cap.latest_dy}, versus {cap.y2024_25.central:usd} in 2024/25; for {ma.cap.latest_dy}, {ma.cap.pjm_same_dy:usd} against {ma.cap.latest:usd} in Massachusetts."

  # ---------------------------------------------------------------- Findings: Massachusetts figures
  fig_ma1:
    value: "{ma.cap.latest:usd}"
    holds: ma.cap.latest < ma.cap.first
    text: capacity charge per year, typical Massachusetts home, {ma.cap.latest_dy} (down from {ma.cap.first:usd} in {ma.cap.first_dy})
    fallback: capacity charge per year, typical Massachusetts home, {ma.cap.latest_dy}
  fig_ma2:
    value: "{isne.latest:pct}"
    text: New England residential price vs. rest of US outside PJM in {isne.latest_year:year}, after inflation (2020 baseline)
  fig_ma3:
    refs: [ma-doer-customer-choice]
    value: "{ma.comp.share:f0}%"
    text: of National Grid, Eversource, and Unitil homes buy supply from a competitive supplier or town aggregation ({ma.comp.period:month})
  fig_ma4:
    value: "{ma.dc.op_mw:int} MW"
    text: of data centers operating in Massachusetts; {ma.dc.pipeline_mw:int} MW proposed or under construction

  # ---------------------------------------------------------------- Findings: Massachusetts charts
  ma_cap_reading:
    holds: ma.cap.min_dy == "2023/24" and ma.cap.latest < 0.5 * ma.cap.first and dc.ne_pipeline_per_1k < 0.25 * dc.pjm_pipeline_per_1k
    text: "The capacity charge pays power plants to be available at peak, and in Massachusetts basic service passes ISO New England's auction price straight through. For a typical home it fell from {ma.cap.first:usd} a year in {ma.cap.first_dy} to {ma.cap.min:usd} in 2023/24, then {ma.cap.y2024_25:usd}, {ma.cap.y2025_26:usd}, and {ma.cap.latest:usd} for {ma.cap.latest_dy}. New England's auctions have little data center demand behind them: {dc.ne_pipeline_gw:f1} GW planned or under construction across the region, against {dc.pjm_pipeline_gw:int} GW in PJM."
    fallback: "Capacity charge for a typical Massachusetts home: {ma.cap.first:usd} a year in {ma.cap.first_dy}, {ma.cap.min:usd} in {ma.cap.min_dy}, {ma.cap.latest:usd} for {ma.cap.latest_dy}."

  ma_cap_note:
    text: "Massachusetts: median of the default-service utilities (National Grid's Massachusetts Electric and Nantucket Electric, Eversource, Unitil), from ISO New England Forward Capacity Auction prices for their zones; ISO New England's next auction is due in {fact.isone_next_auction:year}. Other markets use the same method; see the comparison section below. Delivery years run June to May."

  ne_reading:
    holds: >-
      isne.y2021_lo <= 0 <= isne.y2021_hi and isne.y2022 > 0 and isne.y2023 > isne.y2022 and isne.y2023 >= isne.latest and isne.latest_lo > 0
      and ma.cap.y2023_24 < ma.cap.y2021_22
    text: "New England prices tracked the rest of the country outside PJM in 2021, then rose {isne.y2022:apct} more in 2022 and {isne.y2023:apct} more in 2023, measured from 2020, and were still {isne.latest:apct} above in {isne.latest_year:year}. Capacity charges fell over the same years ({ma.cap.y2021_22:usd} to {ma.cap.y2023_24:usd} per Massachusetts home), so the rise did not come through the capacity auction, the channel that carries data center costs in PJM."
    fallback: "New England residential prices vs. the rest of the US outside PJM, after inflation, relative to 2020: {isne.y2022:pct} in 2022, {isne.y2023:pct} in 2023, {isne.latest:pct} in {isne.latest_year:year} (95% CI {isne.latest_lo:pct} to {isne.latest_hi:pct})."

  ne_note:
    text: "Same regression as the PJM comparison below (utility and month fixed effects, weather controls, standard errors clustered by utility), with New England utilities compared against the rest of the US outside PJM, so PJM's own rise does not set the baseline. {isne.latest_year:year} covers {run.latest_months}."

  ma_price_reading:
    holds: ma.price.ng.max_year == 2023 and ma.price.muni.last < 0.6 * ma.price.ng.last and ma.price.issue_utility == "Eversource"
    text: "National Grid's price after inflation peaked at {ma.price.ng.max:f1}¢ per kWh in 2023 and was {ma.price.ng.last:f1}¢ in {ma.price.ng.last_year:year}. Eversource's was {ma.price.ev.last:f1}¢ in {ma.price.ev.last_year:year}; its EIA figures from {ma.price.issue_from:month} on are under check and left out. Massachusetts' municipal utilities charged {ma.price.muni.last:f1}¢, about half, and the New England average was {ma.price.ne.last:f1}¢ against {ma.price.us.last:f1}¢ nationally."
    fallback: "Price after inflation, {ma.price.ng.last_year:year}: National Grid {ma.price.ng.last:f1}¢ per kWh, municipal utilities {ma.price.muni.last:f1}¢, New England {ma.price.ne.last:f1}¢, US {ma.price.us.last:f1}¢. Eversource: {ma.price.ev.last:f1}¢ in {ma.price.ev.last_year:year}."

  ma_price_note:
    text: "Residential revenue per kWh from EIA's monthly survey, full calendar years, in dollars of {run.prices_through:month} (Northeast CPI). Utility figures cover homes on the utility's own (basic) supply. Municipal utilities are combined, weighted by sales."

  ma_supply_reading:
    refs: [ma-doer-customer-choice, ma-ago-2026-competitive-supply]
    variants:
      - holds: ma.supply.net_musd < 0 and ma.supply.years_lower >= 2 and ma.supply.spike_supplier < ma.supply.spike_basic - 1 and fact.ago_individual_supply_loss_musd > 0
        text: "{ma.comp.share:f0}% of homes at the three investor-owned utilities buy supply from a competitive supplier or their town's aggregation program ({ma.comp.agg_share:f0}% through towns, {ma.comp.individual_share:f0}% individually), as of {ma.comp.period:month}. On EIA's statewide averages, competitive suppliers charged more than basic service in {ma.supply.years_higher:int} of {ma.supply.n_years:int} years from {ma.supply.first_year:year} to {ma.supply.last_year:year}, and less in {ma.supply.years_lower:int}, by the most when basic service spiked ({ma.supply.spike_basic:f1}¢ against {ma.supply.spike_supplier:f1}¢ in {ma.supply.spike_year:year}). Over the period, that is about {ma.supply.net_musd:usd_abs} million less than basic service would have cost. That average mixes town aggregation, which buys in bulk, with individual contracts. The Attorney General's office, which studies individual contracts only, finds those households paid **${fact.ago_individual_supply_loss_musd:f1} million more** than basic service from July 2015 to June 2025, ${fact.ago_individual_supply_loss_latest_musd:f1} million of it in the latest year. Taken together, town aggregation, not individual contracts, is what kept the statewide average near or below basic service."
      - holds: ma.supply.net_musd >= 0
        text: "{ma.comp.share:f0}% of homes at the three investor-owned utilities buy supply from a competitive supplier or their town's aggregation program ({ma.comp.agg_share:f0}% through towns, {ma.comp.individual_share:f0}% individually), as of {ma.comp.period:month}. On EIA's statewide averages, competitive suppliers charged more than basic service in {ma.supply.years_higher:int} of {ma.supply.n_years:int} years from {ma.supply.first_year:year} to {ma.supply.last_year:year}: about {ma.supply.net_musd:usd_abs} million more over the period. The average mixes town aggregation with individual contracts."
    fallback: "{ma.comp.share:f0}% of homes at the three investor-owned utilities are on competitive supply or town aggregation ({ma.comp.period:month}). Statewide average supplier price in {ma.supply.last_year:year}: {ma.supply.last_supplier:f1}¢ per kWh; basic service supply: {ma.supply.last_basic:f1}¢."

  ma_supply_note:
    refs: [ma-doer-customer-choice]
    text: "Customer counts: Massachusetts DOER customer choice data (residential rate classes). Prices: EIA-861 annual, nominal cents per kWh. Basic service supply = investor-owned utilities' full-service revenue per kWh minus their delivery-only revenue per kWh; supplier price = energy-only revenue per kWh of competitive suppliers selling to Massachusetts homes. Years without both large utilities in EIA's file are left out."

  ma_dc_reading:
    refs: [isone-2026-large-load-forecast]
    holds: >-
      ma.dc.pipeline_mw < 1000 and ma.dc.largest_mw >= 0.5 * ma.dc.pipeline_mw and ma.dc.largest_status == "proposed"
      and fact.isone_large_load_dc_mw < 1000
    text: "Massachusetts has {ma.dc.n:int} data center sites in the merged list, {ma.dc.op_mw:int} MW operating. Nearly all of the {ma.dc.pipeline_mw:int} MW in the pipeline is one proposal: {ma.dc.largest} in {ma.dc.largest_county} County ({ma.dc.largest_mw:int} MW). New England as a whole has {ne.dc.op_mw:int} MW operating and {ne.dc.pipeline_mw:int} MW proposed or under construction; PJM has {dc.pjm_pipeline_gw:int} GW in its pipeline. ISO New England's own first large-load forecast (2026) counts one data center in its formal study process, {fact.isone_large_load_dc_mw:int} MW in the Northeast Massachusetts and Boston zone, and expects all large new loads together to add about {fact.isone_large_load_peak_2030s_mw:int} MW to the region's peak in the 2030s."
    fallback: "Massachusetts data center sites: {ma.dc.n:int}, with {ma.dc.op_mw:int} MW operating and {ma.dc.pipeline_mw:int} MW proposed or under construction. New England: {ne.dc.op_mw:int} MW operating, {ne.dc.pipeline_mw:int} MW proposed or under construction."

  lede_intro:
    text: "Across {local.n_units:int} US utility service areas from 2015 to {run.prices_through:month},"

  lede_local:
    variants:
      - holds: local.hi40 < 0
        text: a utility's own data center load has not pushed up its residential prices relative to neighbors in the same market.
      - holds: local.lo40 <= 0 <= local.hi40
        text: a utility's own data center load has not measurably changed its residential prices relative to neighbors in the same market.
      - holds: local.lo40 > 0
        text: a utility's own data center load has raised its residential prices relative to neighbors in the same market.
    fallback: "a 40% rise in a utility's own commercial load went with a {local.pct40:pct} change in its residential price relative to neighbors in the same market (95% CI {local.lo40:pct} to {local.hi40:pct})."

  lede_regional:
    refs: [imm-2026-som-2025]
    holds: cap.increase > 0 and fact.imm_dc_share_of_increase_2025_26 >= 50
    text: "The cost shows up regionally: in PJM, the grid operator for {fact.pjm_states:int} states and DC, a capacity shortfall driven largely by forecast data center demand now costs a typical household in a restructured state **about {cap.increase:usd} a year more** than in 2024/25."
    fallback: "In PJM, capacity costs a typical household in a restructured state {cap.latest:usd} a year for {cap.latest_dy}, versus {cap.y2024_25.central:usd} in 2024/25."

  # ---------------------------------------------------------------- Findings: headline figures
  fig1:
    value: "{cap.increase:usd}"
    holds: cap.increase > 0
    text: more per year for capacity in {cap.latest_dy} than 2024/25, typical restructured-PJM home
    fallback: change in yearly capacity cost, {cap.latest_dy} vs. 2024/25, typical restructured-PJM home
  fig2:
    value: "{cap.dc_latest:usd}"
    text: of the {cap.dc_latest_dy} cost per home attributed to data center load
  fig3:
    value: "{pjm.latest:pct}"
    text: PJM residential price vs. rest of US in {pjm.latest_year:year}, after inflation (2020 baseline)
  fig4:
    value: "{local.pct40:pct}"
    text: residential price change with 40% more local commercial load, vs. regional peers

  # ---------------------------------------------------------------- Findings: chart readings
  c1_reading:
    refs: [imm-2026-som-2025, pjm-2026-bra-2028-29]
    holds: >-
      cap.min_dy == "2023/24" and cap.latest_is_max and cap.y2025_26.central > 2 * cap.y2024_25.central
      and cap.dc_min is not None and fact.pjm_capped_auctions.endswith(auc.latest_dy)
    text: "Capacity costs for a typical home fell to {cap.y2023_24.central:usd} a year in 2023/24, then jumped to {cap.y2025_26.central:usd} when the 2025/26 auction cleared at {auc.y2025_26:usd2} per MW-day, and reached {cap.latest:usd} as the {fact.pjm_capped_auctions} auctions cleared at the price cap. That is the highest level in the record, about {cap.ratio_first:f1} times {cap.first_dy}. The market monitor attributes roughly {cap.dc_min:usd} to {cap.dc_max:usd} a year of it to data center load."
    fallback: "Capacity cost for a typical home: {cap.y2024_25.central:usd} a year in 2024/25, {cap.y2025_26.central:usd} in 2025/26, and {cap.latest:usd} in {cap.latest_dy}. The market monitor attributes {cap.dc_min:usd} to {cap.dc_max:usd} a year to data center load in the years it has assessed."

  c1_compare:
    holds: >-
      cap_ne.latest < 0.6 * cap.same_dy_as_ne and cap_ne.latest < cap_ne.first
      and dc.ne_pipeline_per_1k < 0.25 * dc.pjm_pipeline_per_1k
    text: "New England is the comparison. Its capacity auctions have little data center demand behind them ({dc.ne_pipeline_gw:f1} GW of data centers planned or under construction, against {dc.pjm_pipeline_gw:int} GW in PJM), and a typical home's capacity cost there fell from {cap_ne.first:usd} a year in {cap_ne.first_dy} to {cap_ne.latest:usd} in {cap_ne.latest_dy}, against {cap.same_dy_as_ne:usd} in restructured PJM."
    fallback: "In New England, a typical home's capacity cost was {cap_ne.first:usd} a year in {cap_ne.first_dy} and {cap_ne.latest:usd} in {cap_ne.latest_dy}; in restructured PJM, {cap.same_dy_as_ne:usd} in {cap_ne.latest_dy}."

  c1_miso:
    holds: cap_miso.max > 10 * cap_miso.min and cap_miso.latest < cap_miso.max
    text: "In MISO, the central US grid, most utilities supply their own capacity, so auction prices reach household bills directly mainly at Ameren Illinois. There the cost has swung rather than climbed: {cap_miso.y2022_23:usd} a year in 2022/23, {cap_miso.y2023_24:usd} the next year, {cap_miso.y2025_26:usd} in 2025/26 when the summer price hit ${auc_miso.summer.y2025_26:f2} per MW-day, and {cap_miso.latest:usd} for {cap_miso.latest_dy}. MISO has {dc.miso_pipeline_gw:int} GW of data centers planned or under construction ({dc.miso_pipeline_per_1k:f1} MW per 1,000 homes, against {dc.pjm_pipeline_per_1k:f1} in PJM)."
    fallback: "In MISO, capacity cost for an Ameren Illinois home was {cap_miso.y2025_26:usd} a year in 2025/26 and {cap_miso.latest:usd} for {cap_miso.latest_dy}."

  c1_ny:
    holds: nyiso.record_month_in_latest_summer and dc.ny_pipeline_per_1k < 0.25 * dc.pjm_pipeline_per_1k
    text: "New York has little data center load ({dc.ny_pipeline_gw:f1} GW planned or under construction, {dc.ny_pipeline_per_1k:f1} MW per 1,000 homes), yet New York City's capacity price, which sets most of Con Edison's cost, reached a record ${nyiso.nyc_month_max:f2} per kW-month in {nyiso.nyc_month_max_when:month} and averaged ${nyiso.nyc_summer_avg:f2} over summer {nyiso.nyc_summer_year:year}. Statewide, a typical New York home's capacity cost was {cap_ny.latest:usd} a year for {cap_ny.latest_dy}."
    fallback: "In New York, a typical home's capacity cost was {cap_ny.latest:usd} a year for {cap_ny.latest_dy}; New York City's capacity price averaged ${nyiso.nyc_summer_avg:f2} per kW-month in summer {nyiso.nyc_summer_year:year}."

  c1_note:
    refs: [pjm-2026-bra-2028-29, imm-2026-som-2025]
    text: "PJM: median across {cap.n_utilities:int} utilities in {cap.states} whose default supply passes auction prices through. New England: median across {cap_ne.n_utilities:int} utilities in {cap_ne.states}, from ISO New England Forward Capacity Auction prices; its next auction is due in {fact.isone_next_auction:year}. MISO: Ameren Illinois, from MISO Planning Resource Auction prices (seasonal since 2023/24, weighted by days). New York: median across 7 utilities, from 12-month averages of NYISO's monthly spot auctions by locality (New York City, Long Island, lower Hudson Valley, rest of state), May-to-April years through {cap_ny.latest_dy}. Auction results from PJM Base Residual Auction reports through {run.auctions_through}; data center attribution from PJM's Independent Market Monitor through {run.dc_attribution_through}. Delivery years run June to May."

  c2_reading:
    holds: >-
      pjm.null_through_2021 and pjm.first_sig_year is not None and pjm.first_sig_year <= 2023
      and pjm.y2023 - pjm.y2022 > 5 and pjm.latest >= pjm.max_before_latest
    text: "PJM prices tracked the rest of the country through 2021. The gap opened in {pjm.first_sig_year:year} ({pjm.first_sig:pct}), jumped in 2023 ({pjm.y2023:pct}), and widened to {pjm.latest:pct} in {pjm.latest_year:year} as capacity costs reached bills. The confidence band excludes zero from {pjm.first_sig_year:year} on."
    fallback: "PJM residential prices compared with the rest of the US, after inflation: {pjm.y2022:pct} in 2022, {pjm.y2023:pct} in 2023, {pjm.y2025:pct} in 2025, and {pjm.latest:pct} in {pjm.latest_year:year} (95% CI {pjm.latest_lo:pct} to {pjm.latest_hi:pct})."

  c2_note:
    text: "Regression on utility-month residential prices with utility and month fixed effects and weather controls; standard errors clustered by utility. {pjm.latest_year:year} covers {run.latest_months}."

  c3_reading:
    refs: [mdopc-2025-07-auction]
    holds: sites.md.op_gw < 1 and case.bge.chg19 > 0 and case.dom.ytd_year == 2026 and gen.texas > gen.pjm
    text: "Baltimore Gas & Electric's customers, in a PJM state with few large data centers of its own ({sites.md.op_gw:f1} GW operating in Maryland vs. {sites.va.op_gw:f0} GW in Virginia), saw real prices rise {case.bge.chg19:f0}% between 2019 and {case.ytd_year:year} ({case.bge.ytd:pct} versus the same months last year). Dominion's real price changed {case.dom.chg19:pct0} over the same period ({case.dom.ytd:pct} versus the same months last year, its first full year inside the PJM capacity auction). Texas, an energy-only market with {gen.texas:f0} GW of new generation planned (PJM: {gen.pjm:f0} GW), was at {case.tx.idx:f0}, and Georgia Power at {case.ga.idx:f0}, on a 2019 = 100 scale."
    fallback: "Inflation-adjusted residential price in {case.ytd_year:year} on a 2019 = 100 scale: Baltimore Gas & Electric {case.bge.idx:f0}, Dominion {case.dom.idx:f0}, Texas statewide {case.tx.idx:f0}, Georgia Power {case.ga.idx:f0}. Versus the same months last year: {case.bge.ytd:pct}, {case.dom.ytd:pct}, {case.tx.ytd:pct}, and {case.ga.ytd:pct}."

  c3_note:
    text: "Residential price after inflation (Census-region CPI), indexed to 2019 = 100. The {case.ytd_year:year} point (dashed) applies the {run.latest_months} change vs. the same months of {case.last_full_year:year}, so seasonal rates don't distort it. Texas is the statewide total, which includes some areas outside ERCOT."

  # ---------------------------------------------------------------- Findings: notes
  local_note:
    refs: [epri-2026-dc-rates, lbnl-2025-retail-price-trends]
    variants:
      - holds: local.hi40 < 0 and pjm.latest_lo > 0
        text: "**What doesn't explain it.** Comparing each utility with others in its own regional market and month, a 40% rise in its own commercial load goes with a {local.pct40:pct} change in residential price (95% CI {local.lo40:pct} to {local.hi40:pct}). More sales spread fixed costs. The burden comes from regional supply shortfalls and how each market passes them through."
      - holds: local.lo40 <= 0 <= local.hi40 and pjm.latest_lo > 0
        text: "**What doesn't explain it.** Comparing each utility with others in its own regional market and month, a 40% rise in its own commercial load goes with no measurable change in residential price ({local.pct40:pct}; 95% CI {local.lo40:pct} to {local.hi40:pct}). The burden comes from regional supply shortfalls and how each market passes them through."
    fallback: "**Local load.** Comparing each utility with others in its own regional market and month, a 40% rise in its own commercial load goes with a {local.pct40:pct} change in residential price (95% CI {local.lo40:pct} to {local.hi40:pct})."

  local_benchmark:
    holds: local.hi40 < 0
    text: "This matches EPRI's state-level causal study, which estimates that data center growth from 2019 to 2024 lowered average residential rates about {fact.epri_dc_rate_effect_2019_2024_pct:f0}%."
    fallback: ""

  rel_utility:
    holds: rel.saidi.lo <= 0 and rel.saifi.lo <= 0
    text: "**What about reliability?** Across {rel.n_units:int} utilities ({rel.years}), a 40% rise in a utility's own commercial load has not gone with more outages: {rel.saidi.pct:pct} in everyday outage minutes per customer (95% CI {rel.saidi.lo:pct} to {rel.saidi.hi:pct}) and {rel.saifi.pct:pct} in the number of outages, compared with utilities in the same regional grid and year. Including major storms, {rel.med.pct:pct}."
    fallback: "**Reliability.** Across {rel.n_units:int} utilities ({rel.years}), a 40% rise in a utility's own commercial load goes with {rel.saidi.pct:pct} in everyday outage minutes per customer (95% CI {rel.saidi.lo:pct} to {rel.saidi.hi:pct}) and {rel.saifi.pct:pct} in the number of outages, compared with utilities in the same regional grid and year."
  rel_county:
    holds: rel.county.max_lo <= 0
    text: "The {rel.county.n_high:int} counties with the most operating data center load had no more outage hours than other counties in their state ({rel.county.last_year:year}: {rel.county.last:pct})."
    fallback: "Outage hours in the {rel.county.n_high:int} counties with the most operating data center load, compared with other counties in their state: {rel.county.last:pct} in {rel.county.last_year:year}."
  rel_supply:
    refs: [nerc-2026-ltra-2025]
    text: "These are local outages that have already happened; the forward risk is supply: PJM's 2027/28 auction cleared about {fact.pjm_shortfall_2027_28_mw:r100} MW short of its reliability target."

  caveat_timing:
    holds: pjm.first_sig_year is not None and pjm.first_sig_year <= 2023 and pjm.latest > pjm.y2024
    text: "**Caveats.** The PJM premium began in {pjm.first_sig_year:year}, before capacity prices spiked, which is consistent with 2022 gas prices being locked into default-service supply contracts; capacity costs explain its widening since 2025."
    fallback: "**Caveats.**"
  caveat_upper_bound:
    refs: [pjm-2026-bra-2028-29]
    text: "Auction totals are cleared MW times price, which PJM notes overstates cost to load because some load is hedged or self-supplied, so household figures are upper-bound averages."
  caveat_coverage:
    holds: cov.n_states_competitive > 0
    text: "In {cov.n_states_competitive:int} states ({cov.states_competitive}), at least 10% of homes buy supply from competitive suppliers or aggregation programs, about {cov.homes_competitive:int} homes in all; EIA's monthly data price only the utility's own supply there, so price comparisons in those states describe homes on utility supply (see Data status)."
    fallback: ""

  caveat_dominion:
    holds: case.dom.ytd_year == 2026
    text: "Dominion's {case.dom.ytd_year:year} increase also includes an approved base-rate increase of {fact.dominion_base_rate_increase_usd_month:usd2} a month."
    fallback: ""

  # ---------------------------------------------------------------- Methods page
  m_capacity_prices:
    refs: [pjm-2024-bra-2025-26, pjm-2025-bra-2026-27, pjm-2026-bra-2028-29]
    where: methods
    holds: fact.pjm_capped_auctions.endswith(auc.latest_dy)
    text: "Prices rose from {auc.y2024_25:usd2} per MW-day for 2024/25 to {auc.y2025_26:usd2} for 2025/26, then reached the price cap in each of the {fact.pjm_capped_auctions} auctions ({auc.y2026_27:usd2}, {auc.y2027_28:usd2}, {auc.y2028_29:usd2}). Without the cap, the 2028/29 auction would have cleared at {fact.pjm_uncapped_2028_29_usd_mw_day:usd2}."
    fallback: "Prices rose from {auc.y2024_25:usd2} per MW-day for 2024/25 to {auc.y2025_26:usd2} for 2025/26; the latest auction ({auc.latest_dy}) cleared at {auc.latest:usd2}."

  m_capacity_result:
    refs: [imm-2026-som-2025]
    where: methods
    holds: cap.latest_is_max and cap.increase > 0
    text: "**Result:** for a typical home in a restructured PJM state (about {cap.kwh:int} kWh a year), capacity cost was {cap.y2024_25.central:usd} a year in 2024/25, {cap.y2025_26.central:usd} ({cap.y2025_26.low:usd}-{cap.y2025_26.high:usd}) in 2025/26, {cap.y2026_27.central:usd} ({cap.y2026_27.low:usd}-{cap.y2026_27.high:usd}) in 2026/27, and {cap.latest:usd} ({cap.latest_low:usd}-{cap.latest_high:usd}) in {cap.latest_dy}: about {cap.increase:usd} a year more than 2024/25. The market monitor's findings attribute about {cap.dc_min:usd}-{cap.dc_max:usd} a year of it to data center load. The {cap.latest_dy} level is the highest in the series, about {cap.ratio_base:f0} times 2024/25 and {cap.ratio_first:f1} times {cap.first_dy}."
    fallback: "**Result:** for a typical home in a restructured PJM state (about {cap.kwh:int} kWh a year), capacity cost was {cap.y2024_25.central:usd} a year in 2024/25 and {cap.latest:usd} ({cap.latest_low:usd}-{cap.latest_high:usd}) in {cap.latest_dy}. The market monitor's findings attribute about {cap.dc_min:usd}-{cap.dc_max:usd} a year to data center load in the years it has assessed."

  m_capacity_ne:
    where: methods
    holds: cap_ne.latest < cap_ne.first
    text: "**New England.** ISO New England's Forward Capacity Auctions run three years ahead with the same June-to-May years. The region-wide price fell from ${auc_ne.y2018_19:f2} per kW-month for 2018/19 to ${auc_ne.y2026_27:f2} for 2026/27, then rose to ${auc_ne.y2027_28:f2} for 2027/28; the next auction, for 2028/29, is due in {fact.isone_next_auction:year} after a delay for market redesign. With the same method and New England's annual energy, a typical home's capacity cost fell from {cap_ne.first:usd} a year to {cap_ne.latest:usd}. All New England states but Vermont pass auction prices through default supply. No data center attribution has been published; the region has {dc.ne_pipeline_gw:f1} GW of data centers planned or under construction, about {dc.ne_pipeline_per_1k:f1} MW per 1,000 homes against {dc.pjm_pipeline_per_1k:f1} in PJM."
    fallback: "**New England.** ISO New England Forward Capacity Auction prices converted to $/MW-day; a typical home's capacity cost was {cap_ne.first:usd} a year for {cap_ne.first_dy} and {cap_ne.latest:usd} for {cap_ne.latest_dy}."

  m_capacity_miso:
    where: methods
    holds: cap_miso.max > 10 * cap_miso.min
    text: "**MISO.** MISO's Planning Resource Auction is held each spring for the coming June-to-May year, with separate summer, fall, winter, and spring prices since 2023/24; seasonal prices are weighted by days. Most MISO utilities are regulated and supply their own capacity, so the site applies auction prices only where default supply buys capacity in the auction: Ameren Illinois (Zone 4). Its typical home's cost ranged from {cap_miso.min:usd} to {cap_miso.max:usd} a year ({cap_miso.max_dy}); for {cap_miso.latest_dy} it is {cap_miso.latest:usd}. No data center attribution has been published."
    fallback: "**MISO.** Ameren Illinois (Zone 4) capacity cost from MISO Planning Resource Auction prices: {cap_miso.latest:usd} a year for {cap_miso.latest_dy}."

  m_capacity_ny:
    where: methods
    holds: cap_ny.max > cap_ny.min
    text: "**New York.** NYISO buys capacity in seasonal and monthly auctions and a monthly spot auction, priced separately for New York City, Long Island, the lower Hudson Valley (the G-J Locality), and the rest of the state. The site averages the 12 monthly spot prices in each May-to-April capability year (complete years only, through {cap_ny.latest_dy}), read from NYISO's public auction viewer each week, and uses an approximate statewide requirement of 36 GW (forecast peak of about 31.5 GW plus the 18-24% installed reserve margin, less derating). All seven large New York utilities pass these costs through, including the Long Island Power Authority through its power supply charge. A typical home's cost ranged from {cap_ny.min:usd} to {cap_ny.max:usd} a year; Con Edison's peaked at {cap_ny.coned_max:usd} ({cap_ny.coned_max_dy}). New York City's spot price reached ${nyiso.nyc_month_max:f2} per kW-month in {nyiso.nyc_month_max_when:month}."
    fallback: "**New York.** NYISO monthly spot capacity prices by locality, averaged over May-to-April years; a typical home's cost was {cap_ny.latest:usd} for {cap_ny.latest_dy}."

  m_local:
    refs: [epri-2026-dc-rates, lbnl-2025-retail-price-trends]
    where: methods
    variants:
      - holds: local.hi40 < 0
        text: "**Local load:** comparing each utility only with others in the same regional grid in the same month, a 40% rise in its own commercial load goes with a **{local.pct40:apct} lower** residential price (95% CI {local.hi40:apct} to {local.lo40:apct} lower). Local load growth has not raised local residential prices relative to regional peers; more sales spread fixed costs."
      - holds: local.lo40 <= 0 <= local.hi40
        text: "**Local load:** comparing each utility only with others in the same regional grid in the same month, a 40% rise in its own commercial load goes with no measurable change in residential price ({local.pct40:pct}; 95% CI {local.lo40:pct} to {local.hi40:pct}). Local load growth has not raised local residential prices relative to regional peers."
    fallback: "**Local load:** comparing each utility only with others in the same regional grid in the same month, a 40% rise in its own commercial load goes with a {local.pct40:pct} change in residential price (95% CI {local.lo40:pct} to {local.hi40:pct})."

  m_local_benchmark:
    where: methods
    holds: local.hi40 < 0
    text: "EPRI's state-level causal study, using a different method (an instrumental variable for where data centers were built), finds the same direction: data center growth from 2019 to 2024 lowered average residential rates about {fact.epri_dc_rate_effect_2019_2024_pct:f0}%."
    fallback: ""

  m_coverage:
    where: methods
    holds: cov.n_states_competitive > 0
    text: "In {cov.n_states_competitive:int} states ({cov.states_competitive}), at least 10% of homes, about {cov.homes_competitive:int} in all, buy supply from competitive suppliers or aggregation programs and are not in the utility-level prices."
    fallback: ""

  m_pjm:
    where: methods
    holds: pjm.null_through_2021 and pjm.first_sig_year is not None and pjm.first_sig_year <= 2023 and pjm.latest >= pjm.max_before_latest
    text: "**PJM vs. the rest of the US** (2020 = 0): no difference from 2017 to 2021; {pjm.y2022:pct} in 2022, {pjm.y2023:pct} in 2023, {pjm.y2024:pct} in 2024, {pjm.y2025:pct} in 2025, {pjm.latest:pct} in {pjm.latest_year:year}. The gap opened **before** capacity prices spiked, consistent with 2022 natural gas prices being locked into default-supply contracts, and widened as capacity costs reached bills from mid-2025."
    fallback: "**PJM vs. the rest of the US** (2020 = 0): {pjm.y2022:pct} in 2022, {pjm.y2023:pct} in 2023, {pjm.y2024:pct} in 2024, {pjm.y2025:pct} in 2025, {pjm.latest:pct} in {pjm.latest_year:year}."

  m_pjm_restructured:
    where: methods
    holds: not pjmr.pre_null
    text: "**Within PJM, restructured vs. regulated:** {pjmr.latest:pct} in {pjmr.latest_year:year}, but the two groups were not on parallel paths before 2020, so this comparison is weaker evidence."
    fallback: "**Within PJM, restructured vs. regulated:** {pjmr.latest:pct} in {pjmr.latest_year:year}."

  m_rel_utility:
    where: methods
    holds: rel.saidi.lo <= 0 and rel.saifi.lo <= 0 and rel.ieee.lo <= 0
    text: "A 40% rise in commercial load goes with **{rel.saidi.pct:pct}** outage minutes (95% CI {rel.saidi.lo:pct} to {rel.saidi.hi:pct}) and {rel.saifi.pct:pct} outages; including major storms, {rel.med.pct:pct} ({rel.med.lo:pct} to {rel.med.hi:pct}). IEEE-only check: {rel.ieee.pct:pct} ({rel.ieee.lo:pct} to {rel.ieee.hi:pct}). No sign that reliability has worsened where commercial load grew."
    fallback: "A 40% rise in commercial load goes with {rel.saidi.pct:pct} outage minutes (95% CI {rel.saidi.lo:pct} to {rel.saidi.hi:pct}) and {rel.saifi.pct:pct} outages; including major storms, {rel.med.pct:pct} ({rel.med.lo:pct} to {rel.med.hi:pct}). IEEE-only check: {rel.ieee.pct:pct} ({rel.ieee.lo:pct} to {rel.ieee.hi:pct})."

  m_rel_county:
    where: methods
    holds: rel.county.max_lo <= 0
    text: "The {rel.county.n_high:int} counties with at least {rel.county.threshold:int} MW of operating data center capacity per 1,000 households had the same or fewer outage hours than other counties in their state each year (2024: {rel.county.y2024:pct0}, the year Hurricane Helene hit rural areas). Descriptive: these counties are mostly suburban, with more underground lines."
    fallback: "The {rel.county.n_high:int} counties with at least {rel.county.threshold:int} MW of operating data center capacity per 1,000 households, compared with other counties in their state: {rel.county.last:pct} outage hours in {rel.county.last_year:year}."

  m_case_dominion:
    where: methods
    holds: case.dom.ytd_year == 2026 and case.dom.base_rate_share is not None
    text: "First year in the PJM capacity auction (its zone cleared at {auc.dom.y2025_26:usd2} for 2025/26). The state regulator approved a base-rate increase of {fact.dominion_base_rate_increase_usd_month:usd2} a month for a typical home in 2026, about {case.dom.base_rate_share:f0}% of the nominal rise; fuel and other charges are not yet separated. A new rate class for customers of {fact.dominion_gs5_min_mw:int} MW or more starts January 2027."
    fallback: "In the PJM capacity auction since 2025/26 (its zone cleared at {auc.dom.y2025_26:usd2} that year)."
  m_case_bge:
    refs: [mdopc-2025-07-auction]
    where: methods
    holds: sites.md.op_gw < 1 and case.bge.real_chg_to_last_full > 0
    text: "Restructured; few large data centers locally. Real price rose {case.bge.real_chg_to_last_full:f0}% from 2019 to {case.last_full_year:year} while local commercial load grew {case.bge.com_growth:f0}%."
    fallback: "Restructured. Real price changed {case.bge.real_chg_to_last_full:pct0} from 2019 to {case.last_full_year:year}; local commercial load {case.bge.com_growth:pct0}."
  m_case_texas:
    where: methods
    holds: gen.texas > gen.pjm
    text: "Energy-only market with {gen.texas:f0} GW of planned generation (vs. {gen.pjm:f0} GW in PJM). Statewide totals include some areas outside ERCOT."
    fallback: "Energy-only market; {gen.texas:f0} GW of planned generation (PJM: {gen.pjm:f0} GW). Statewide totals include some areas outside ERCOT."
  m_case_georgia:
    where: methods
    text: "Regulated, no capacity market; base rates frozen through {fact.georgia_base_rates_frozen_through:year}."

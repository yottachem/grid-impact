[project]
name = "grid-impact"
version = "0.1.0"
description = "Data center load growth vs. residential electricity burden, US"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "pyyaml>=6",
    "openpyxl>=3.1",
    "geopandas>=1.0",
    "pyogrio>=0.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

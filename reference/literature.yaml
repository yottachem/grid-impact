      - Data center load growth is the primary reason for recent capacity market conditions, including high prices.
      - Data center load raised capacity revenues by about $9.3 billion in 2025/26, $7.3 billion in 2026/27, and $6.5 billion in 2027/28 (about $23.1 billion in total).

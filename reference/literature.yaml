  - id: cmu-2025-oeo-grid-impacts
    title: Electricity Grid Impacts of Rising Demand from Data Centers and Cryptocurrency Mining Operations
    authors: [Open Energy Outlook Initiative, Carnegie Mellon University and North Carolina State University]
    publisher: Carnegie Mellon University, Scott Institute for Energy Innovation
    date: 2025-07-28
    url: https://energy.cmu.edu/_files/documents/electricity-grid-impacts-of-rising-demand-from-data-centers-and-cryptocurrency-mining-operations.pdf
    type: research-org
    topics: [load-growth, generation, retail-rates]
    summary: Least-cost power system modeling of data center and crypto-mining growth through 2030.
    findings:
      - Could raise average US generation costs about 8% and power-sector emissions about 30% by 2030.
      - Central and northern Virginia see the largest regional cost increase, over 25%.
      - More than 25 GW of coal plants slated to retire keep running mainly to serve the new demand.
    relation: mixed

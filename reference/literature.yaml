  # ------------------------------------------------------------ Batch 1 (drafted 2026-10-08)
  - id: epri-2026-dc-rates
    title: "Have Data Centers Raised Your Electric Bill? Causal Evidence from the United States"
    authors: ["Watten, Asa", "Bistline, John", "Blanford, Geoffrey"]
    publisher: Electric Power Research Institute (EPRI); arXiv:2606.19777
    date: 2026-06-18
    url: https://arxiv.org/abs/2606.19777
    type: research-org
    topics: [retail-rates, load-growth]
    summary: State-level causal study using the 1947 Interstate Highway Plan (fiber routes) as an instrument for where data centers were built; finds they modestly lowered retail rates from 2015 to 2024.
    findings:
      - Doubling data center capacity lowered residential prices about 3.5% for a fixed level of demand.
      - Data center growth from 2019 to 2024 lowered average residential rates about 6% versus no growth.
      - No sign of cost shifting between customer classes or of spillovers to neighboring states.
      - Warns the effect could reverse if supply constraints bind or projected load does not materialize.
    relation: supports
    relation_note: Agrees with this site's local result (more local load goes with slightly lower residential prices); like the site, it flags supply shortfalls as the way costs could rise.
    use: [benchmark]
    cites: [lbnl-2025-retail-price-trends, epri-2026-powering-intelligence-update]
    accessed: 2026-10-08
    review_by: 2027-06-30
    added: 2026-10-08
    approved: 2026-10-08

  - id: lbnl-2025-retail-price-trends
    title: "Recent Retail Electricity Price Trends: What Do We Know… or Think We Know?"
    authors: ["Wiser, Ryan, et al. (Lawrence Berkeley National Laboratory)", "Hledik, Ryan; Lam, Long; Yan, Audrey (Brattle Group)"]
    publisher: Lawrence Berkeley National Laboratory and The Brattle Group
    date: 2025-10-17
    url: https://eta-publications.lbl.gov/sites/default/files/2025-10/full_summary_retail_price_trends_drivers.pdf
    type: government
    topics: [retail-rates, load-growth]
    summary: National review of what has driven retail electricity prices since 2019, by state and cost component.
    findings:
      - National average retail prices have roughly tracked inflation; only a few states saw material real increases.
      - States with the most load growth generally saw real prices fall (over 1 cent/kWh in the highest-growth states).
      - Main drivers of increases were transmission and distribution spending, extreme weather and wildfire costs, natural gas prices, and some state policies.
    relation: supports
    relation_note: Consistent with this site's finding that local load growth has not raised local residential prices.
    use: [benchmark, context]
    accessed: 2026-10-08
    review_by: 2027-03-31
    added: 2026-10-08
    approved: 2026-10-08

  - id: lbnl-2026-retail-price-trends
    title: "Retail Electricity Price Trends and Drivers: 2026 Edition"
    authors: [Lawrence Berkeley National Laboratory]
    publisher: Lawrence Berkeley National Laboratory
    date: 2026-03
    url: https://eta-publications.lbl.gov/sites/default/files/2026-03/retail_price_trends_2026_edition.pdf
    type: government
    topics: [retail-rates]
    summary: Annual update of the Berkeley Lab retail price review, adding 2025.
    findings:
      - All-sector average retail prices rose 5.3% in nominal terms and 2.6% after inflation in 2025.
      - From 2019 to 2025, nominal residential prices rose 33%, commercial 26%, and industrial 27%.

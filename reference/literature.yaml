  - id: ucs-2025-pjm-transmission
    title: Connection Costs Loophole Costs Customers Over $4 Billion to Connect Data Centers to Power Grid
    authors: ["Jacobs, Mike"]
    publisher: Union of Concerned Scientists
    date: 2025-09-29
    url: https://www.ucs.org/sites/default/files/2025-09/PJM%20Data%20Center%20Issue%20Brief%20-%20Sep%202025.pdf
    type: advocacy
    topics: [transmission, large-load-tariffs]
    summary: Reviews utility filings in seven PJM states for transmission projects built to connect individual data centers, and who pays for them.
    findings:
      - In 2024 alone, about $4.3 billion of data center connection costs were approved for recovery from all customers.
      - Of 130 projects identified, over 95% passed all connection costs to general ratepayers.
      - Largest totals were in Virginia ($1.9 billion) and Ohio ($1.3 billion).
    relation: mixed
    relation_note: Describes a cost channel (local transmission) this site does not yet measure; those costs would add to the regional capacity cost shown here.
    use: [context]
    accessed: 2026-10-08
    review_by: 2027-06-30
    added: 2026-10-08
    approved: 2026-10-08

  - id: harvard-eli-2025-extracting-profits
    title: "Extracting Profits from the Public: How Utility Ratepayers Are Paying for Big Tech's Power"
    authors: ["Martin, Eliza", "Peskoe, Ari"]
    publisher: Harvard Law School Electricity Law Initiative
    date: 2025-03-05
    url: https://eelp.law.harvard.edu/extracting-profits-from-the-public-how-utility-ratepayers-are-paying-for-big-techs-power/
    type: research-org
    topics: [large-load-tariffs, retail-rates]
    summary: Legal review of nearly 50 state proceedings on utility rates and special contracts for data centers.
    findings:
      - Regulators often approve data center special contracts in short orders with little analysis, and terms are frequently confidential.
      - Gaps between federally set transmission and wholesale rates and state-set retail rates can leave other customers paying for infrastructure built for data centers, including for load that never arrives.
    relation: mixed
    relation_note: The site compares utility-wide average prices, which would not reveal cost shifts hidden in special contracts; EPRI reports no systematic shifting between customer classes.
    use: [context]
    accessed: 2026-10-08
    review_by: 2027-03-31
    added: 2026-10-08
    approved: 2026-10-08


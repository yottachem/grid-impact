# Research, reports, filings, and news about data centers, the grid, and household electricity costs.
# Published on the site's References page; cited from Findings and Methods statements
# (analysis/claims.yaml `refs:`) and from hand-entered facts (reference/context_facts.csv `ref`).
#
# One entry per item. Only entries with an `approved` date are published; new entries are added
# with `approved: null` and go live after the owner reviews the batch.
#
#   id           short stable slug: publisher-year-topic
#   title, authors, publisher, date (YYYY-MM or YYYY-MM-DD), url (or doi)
#   type         peer-reviewed | government | grid-operator | market-monitor | regulator |
#                research-org | industry | advocacy | news | dataset
#   topics       any of TOPICS below
#   summary      one sentence, in our words
#   findings     2-4 bullets in our words, with the source's own numbers
#   relation     supports | differs | mixed | context  (compared with this site's findings)
#   relation_note  one sentence on how it lines up with, or differs from, the site
#   use          any of: fact (a number on the site comes from it), benchmark (compared with our
#                results), method (basis for a modeling choice), context
#   cites        ids of entries this one relies on (its references, one level down)
#   accessed     date we last read it
#   review_by    date to check for updates or corrections (reports revised, stories updated)
#   vault        Obsidian note path in the Prod Development vault
#   added, approved
#
# Summaries are our own words; quotes stay short; files are never re-hosted (link only).

topics:
  load-growth: Data center demand and load growth
  capacity-markets: Capacity markets and auctions
  retail-rates: Retail rates and household bills
  transmission: Transmission and distribution costs
  large-load-tariffs: Large-load tariffs and who pays
  reliability: Reliability and resource adequacy
  energy-burden: Energy burden and affordability
  siting: Siting, water, land, and local impacts
  generation: Generation, emissions, and fuel
  data: Data center data and trackers


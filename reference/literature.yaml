    type: industry
    topics: [large-load-tariffs, siting]
    summary: Law firm summary of seven California data center laws signed in 2026, most effective January 1, 2027.
    findings:
      - SB 886 assigns transmission upgrade costs to data centers, limits refunds, and adds early-exit fees; AB 2383 requires data center generation tariffs (25 MW and up) by 2028; SB 1168 directs the CPUC to study data center rates that protect residential customers.
      - AB 1577 requires annual energy reporting for facilities of 10 MW or more; AB 2619 requires water-use reporting.
      - SB 887 ends CEQA exemptions for data centers; AB 2469 requires water-supply assessments.

  - id: hk-2026-california-dc-laws
    title: "California's 2026 Data Center Laws: What You Need to Know"
    authors: ["Plume, Tamsen", "Brownlow, Bradley B.", "de la Rosa, Daniela", "Targ, Nicholas William"]
    publisher: Holland & Knight
    date: 2026-10-05

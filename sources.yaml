# Source registry. `check` = how often the pipeline polls for a new release.
# Ingest skips when the upstream content hash is unchanged; any change triggers
# marts rebuild + site redeploy. `expected_max_gap_days` drives the freshness monitor.
sources:
  eia930_daily:
    name: EIA-930 daily balancing authority demand
    publisher: U.S. EIA
    url: https://api.eia.gov/v2/electricity/rto/daily-region-data/
    check: daily
    expected_max_gap_days: 3
    license: Public domain (US Gov)
    module: ingest.eia930
  eia861m:
    name: EIA-861M monthly utility sales, revenue, customers
    publisher: U.S. EIA
    url: https://www.eia.gov/electricity/data/eia861m/
    check: weekly
    expected_max_gap_days: 45
    license: Public domain (US Gov)
    module: ingest.eia861m
  pudl_eia861_annual:
    name: PUDL EIA-861 annual (sales, service territory, reliability)
    publisher: Catalyst Cooperative
    url: https://s3.us-west-2.amazonaws.com/pudl.catalyst.coop/stable/
    check: weekly
    expected_max_gap_days: 400
    license: CC-BY-4.0
    module: ingest.pudl
  im3_datacenters:
    name: PNNL IM3 Open Source Data Center Atlas (existing)
    publisher: PNNL
    url: https://github.com/IMMM-SFA/datacenter-atlas
    check: weekly
    expected_max_gap_days: 365
    license: BSD-2-Clause (verify; see repo LICENSE)
    module: ingest.im3
  peeringdb_facilities:
    name: PeeringDB facilities (US)
    publisher: PeeringDB
    url: https://www.peeringdb.com/api/fac
    check: weekly
    expected_max_gap_days: 14
    license: PeeringDB AUP (verify redistribution terms)
    module: ingest.peeringdb
  osm_datacenters:
    name: OpenStreetMap data center features (Overpass)
    publisher: OpenStreetMap contributors
    url: https://overpass-api.de/api/interpreter
    check: weekly
    expected_max_gap_days: 21
    license: ODbL-1.0 (attribution + share-alike on derived databases)
    module: ingest.osm
  fractracker_datacenters:
    name: FracTracker Open U.S. Data Centers Tracker (existing + proposed)
    publisher: FracTracker Alliance
    url: https://fractracker.org/data-centers-tracker/
    check: weekly
    expected_max_gap_days: 21
    license: Non-commercial use only (FracTracker terms of service)
    redistribution: separate CC-BY-NC download with attribution; excluded from CC-BY marts
    module: ingest.fractracker
  eaglei_outages:
    name: ORNL EAGLE-I county outages, 15-min (aggregated to county-day)
    publisher: Oak Ridge National Laboratory
    url: https://doi.org/10.6084/m9.figshare.24237376
    check: monthly
    expected_max_gap_days: 400  # one release per year, ~3-12 months after year end
    license: CC-BY-4.0
    module: ingest.eaglei
  census_counties:
    name: Census cartographic boundary counties, 1:500k
    publisher: U.S. Census Bureau
    url: https://www.census.gov/geographies/mapping-files/time-series/geo/cartographic-boundary.html
    check: monthly
    expected_max_gap_days: 800  # vintage pinned in module; bump yearly
    license: Public domain (US Gov)
    module: ingest.census_counties
  acs_county:
    name: Census ACS 5-year households and median household income (counties; tracts in cost-layer states)
    publisher: U.S. Census Bureau
    url: https://www2.census.gov/programs-surveys/acs/summary_file/
    check: monthly
    expected_max_gap_days: 800  # vintage pinned in module; bump each December
    license: Public domain (US Gov)
    module: ingest.acs
  hifld_territories:
    name: Electric retail service territories (HIFLD mirror)
    publisher: HIFLD via hifld.publicenvirodata.org
    url: https://hifld.publicenvirodata.org/collections/hifld/datasets/electric-retail-service-territories
    check: monthly
    expected_max_gap_days: 800
    license: Public domain (US Gov, HIFLD Open)
    module: ingest.hifld
  bls_cpi:
    name: BLS CPI-U all items and electricity (US, regions, metros)
    publisher: U.S. Bureau of Labor Statistics
    url: https://api.bls.gov/publicAPI/v1/timeseries/data/
    check: weekly
    expected_max_gap_days: 45
    license: Public domain (US Gov)
    module: ingest.bls_cpi
  noaa_degree_days:
    name: NOAA nClimDiv county heating and cooling degree days, monthly
    publisher: NOAA NCEI
    url: https://www.ncei.noaa.gov/monitoring-content/data/us/climdiv/monthly/current/
    check: weekly
    expected_max_gap_days: 45
    license: Public domain (US Gov)
    module: ingest.noaa_degree_days
  eia860m:
    name: EIA-860M monthly generator inventory (operating, planned, retired, canceled)
    publisher: U.S. EIA
    url: https://www.eia.gov/electricity/data/eia860m/
    check: weekly
    expected_max_gap_days: 45
    license: Public domain (US Gov)
    module: ingest.eia860m
  eia930_annual:
    name: EIA-930 annual energy by ISO/RTO (sum of daily demand)
    publisher: U.S. EIA
    url: https://api.eia.gov/v2/electricity/rto/daily-region-data/
    check: monthly
    expected_max_gap_days: 400
    license: Public domain (US Gov)
    module: ingest.eia930_annual
  census_tracts:
    name: Census cartographic boundary tracts, 1:500k (neighborhood cost layer states)
    publisher: U.S. Census Bureau
    url: https://www.census.gov/geographies/mapping-files/time-series/geo/cartographic-boundary.html
    check: monthly
    expected_max_gap_days: 800
    license: Public domain (US Gov)
    module: ingest.census_tracts
